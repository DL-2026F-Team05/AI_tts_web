<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1849a9">
  <title>패키지 읽어주기</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="top">
    <h1>패키지 읽어주기</h1>
    <p class="lead">식품 포장을 찍으면 소비기한과 알레르기 정보를 위험한 것부터 읽어 드려요.</p>
  </header>

  <main id="main">
    <section class="capture" aria-label="사진 찍기">
      <button id="captureBtn" class="btn btn-primary btn-xl" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        <span>사진 찍기</span>
      </button>
      <input id="fileInput" type="file" accept="image/*" capture="environment" class="visually-hidden" tabindex="-1" aria-hidden="true">
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="card result" aria-labelledby="resultTitle" hidden>
      <div class="result-head">
        <h2 id="resultTitle" tabindex="-1">안내</h2>
        <span id="riskBadge" class="badge"></span>
      </div>
      <p id="summary" class="summary"></p>
      <div class="controls">
        <button id="replayBtn" class="btn" type="button">다시 듣기</button>
        <button id="moreBtn" class="btn" type="button">더 듣기</button>
        <button id="stopBtn" class="btn btn-quiet" type="button">멈추기</button>
      </div>
      <p id="detail" class="detail" hidden></p>
    </section>

    <div id="srAnnounce" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

    <section class="card" aria-labelledby="samplesTitle">
      <h2 id="samplesTitle">샘플로 해 보기</h2>
      <p class="hint">합성한 포장 사진이에요. 카메라 없이 흐름을 확인할 수 있어요.</p>
      <div id="sampleList" class="samples"></div>
    </section>

    <details class="card fold" id="settingsBox">
      <summary><h2>내 설정</h2></summary>
      <fieldset class="allergen-set">
        <legend>내 알레르기 성분</legend>
        <p class="hint">고른 성분이 들어 있으면 가장 먼저 경고해요.</p>
        <div id="allergenList" class="chips"></div>
      </fieldset>
      <div class="field">
        <label for="speedInput">말하기 속도 <output id="speedOut" for="speedInput">1.0</output>배</label>
        <input id="speedInput" type="range" min="0.7" max="1.6" step="0.1" value="1.0">
      </div>
      <div class="field check">
        <input id="srMode" type="checkbox">
        <label for="srMode">스크린리더로 듣기 <span class="hint">(앱 음성 대신 쓰고 있는 스크린리더가 읽어요)</span></label>
      </div>
      <div class="field check">
        <input id="waitSound" type="checkbox" checked>
        <label for="waitSound">분석하는 동안 작은 소리 내기</label>
      </div>
    </details>

    <details class="card fold dev" id="devBox">
      <summary><h2>개발자 보기</h2></summary>
      <div class="dev-grid">
        <div>
          <h3>인식 결과</h3>
          <canvas id="overlay" width="560" height="400" aria-label="인식한 글자 위치"></canvas>
          <ul class="legend" id="legend"></ul>
        </div>
        <div>
          <h3>뽑은 정보</h3>
          <table class="kv" id="fieldsTable"><tbody></tbody></table>
          <h3>시간과 엔진</h3>
          <table class="kv" id="timingTable"><tbody></tbody></table>
        </div>
      </div>
      <div class="field">
        <label for="todayInput">기준 날짜 (비우면 오늘)</label>
        <input id="todayInput" type="date">
      </div>
      <div class="field">
        <label for="textInput">OCR 없이 글자로 해 보기 (한 줄 = OCR 한 줄)</label>
        <textarea id="textInput" rows="5" placeholder="예)&#10;제품명: 테스트 과자&#10;알레르기 유발물질: 밀, 우유 함유&#10;소비기한: 2026.12.31까지"></textarea>
        <button id="textBtn" class="btn" type="button">글자로 분석</button>
      </div>
      <h3>결과 JSON</h3>
      <pre id="rawJson" class="raw">아직 결과가 없어요.</pre>
    </details>
  </main>

  <footer class="foot">딥러닝 2026-2 Team05 · 시연용 데모입니다. 실제 섭취 판단은 포장 표시를 함께 확인하세요.</footer>

  <audio id="player" preload="auto"></audio>
  <script src="/static/app.js" defer></script>
</body>
</html>
